name: pertanian_mobile
description: "Aplikasi Android Native Sistem Informasi Pertanian & Pemetaan GIS BPP Kecamatan Lembeyan"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Peta Spasial GIS (Satelit Esri World Imagery)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Sensor Perangkat Keras
  geolocator: ^11.0.0
  flutter_compass: ^0.8.0
  image_picker: ^1.0.7
  image: ^4.1.7

  # Jaringan & REST API Backend Next.js
  dio: ^5.4.1
  connectivity_plus: ^6.1.0

  # Penyimpanan Lokal Offline di Sawah
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # Scan QR & Barcode Kartu Tani
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0

  # UI & Utilitas
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
