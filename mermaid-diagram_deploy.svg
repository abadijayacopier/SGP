  <text x="106.917" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="106.917" dy="-3.9000000000000012">💻 Laptop Anda</tspan><tspan x="106.917" dy="16.900000000000002">(Tambah Fitur)</tspan></text>
</g>
<g class="node" data-id="B" data-label="🐙 GitHub Repository" data-shape="rectangle">
  <rect x="367.99" y="48.45" width="164.95600000000002" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
