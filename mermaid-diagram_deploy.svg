  <rect x="217.83400000000003" y="50.90000000000001" width="106.15600000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="270.91200000000003" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">git push origin main</text>
</g>
<g class="edge-label" data-from="B" data-to="C" data-label="bash update.sh
(Otomatis / 1 Klik)">
  <rect x="576.946" y="43.900000000000006" width="91.30600000000003" height="44.6" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="622.599" y="66.2" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="622.599" dy="-3.3000000000000007">bash update.sh</tspan><tspan x="622.599" dy="14.3">(Otomatis / 1 Klik)</tspan></text>
</g>
