  <text x="808.0680000000001" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="808.0680000000001" dy="-3.9000000000000012">☁️ VPS Indonesia</tspan><tspan x="808.0680000000001" dy="16.900000000000002">(Aplikasi Langsung Baru)</tspan></text>
</g>
</svg>